<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can count and say how many.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff7ea; --ink:#33312c; --soft:#8a8478;
    --teal:#17b8c4; --teal-d:#0e8e9b; --coral:#ef6f5b; --sunny:#ffcf3f;
    --card:#fffdf7;
    --font-display:"Fredoka","Baloo 2",ui-rounded,"Trebuchet MS","Comic Sans MS",sans-serif;
    --font-body:"Nunito",ui-rounded,"Trebuchet MS","Comic Sans MS",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 20% 8%,#fff 0,var(--paper) 45%);
    color:var(--ink);
    font-family:var(--font-body);
    height:100dvh;overflow:hidden;
  }
  .title,.tt-title,.answerbox .abq,.answerbox .abn,.startgate h2,.startgate .txt,.badge{font-family:var(--font-display);}
  .wrap{max-width:820px;margin:0 auto;height:100dvh;padding:10px 14px;display:flex;flex-direction:column;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;margin-bottom:6px;}
  .title{font-size:clamp(16px,3.8vw,24px);font-weight:500;line-height:1.15;}
  .title .q{color:var(--coral);}
  .controls{display:flex;gap:8px;}
  .iconbtn{
    width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--card);
    font-size:18px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}

  .stage{
    position:relative;flex:1 1 auto;min-height:0;width:100%;
    background:radial-gradient(circle at 50% 45%, #fffdf7 0, #fbf2dd 100%);
    border:5px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);overflow:hidden;
  }
  .obj{
    position:absolute;transform:translate(-50%,-50%) scale(0);opacity:0;line-height:1;
    padding:3px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15));
  }
  .obj.in{opacity:1;animation:popIn .46s cubic-bezier(.2,.85,.3,1.3) forwards;}
  @keyframes popIn{0%{transform:translate(-50%,-50%) scale(0);}60%{transform:translate(-50%,-50%) scale(1.18);}100%{transform:translate(-50%,-50%) scale(1);}}
  .glyph{display:block;line-height:1;}
  .badge{
    position:absolute;top:-0.1em;right:-0.1em;min-width:1.4em;height:1.4em;padding:0 0.3em;
    background:var(--teal);color:#fff;border:0.16em solid #fff;border-radius:999px;
    font-size:0.46em;font-weight:500;display:none;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .obj.counted .badge{display:flex;animation:pop .3s ease;}
  .obj.counted::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:rgba(23,184,196,.16);z-index:-1;}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

  .readout{flex:none;text-align:center;margin-top:10px;min-height:104px;display:flex;align-items:center;justify-content:center;}
  .answerbox{
    display:inline-flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff2cf;border:5px solid var(--coral);border-radius:20px;padding:8px 32px;
    opacity:0;transform:scale(.6);
  }
  .answerbox.show{opacity:1;animation:abPop .55s cubic-bezier(.2,.85,.3,1.3) forwards;}
  @keyframes abPop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
  .answerbox .abq{font-size:clamp(15px,3.8vw,20px);font-weight:500;color:var(--coral);}
  .answerbox .abn{font-size:clamp(40px,11vw,64px);font-weight:500;color:var(--coral);line-height:1;}

  .spark{position:absolute;font-size:24px;pointer-events:none;animation:floatUp 1.3s ease-out forwards;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}

  .hint{flex:none;text-align:center;font-size:12px;color:var(--soft);margin-top:6px;}

  @media (max-height:560px){ .hint{display:none;} .readout{min-height:84px;} }

  .startgate{
    position:fixed;inset:0;z-index:50;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 38%,#fff 0,var(--paper) 60%);padding:20px;text-align:center;
  }
  .startgate h2{margin:0;font-size:clamp(20px,5.5vw,32px);font-weight:500;color:var(--ink);max-width:520px;}
  .startgate .play{
    width:96px;height:96px;border-radius:50%;background:var(--teal);color:#fff;border:5px solid var(--ink);
    box-shadow:0 6px 0 var(--ink);font-size:42px;display:flex;align-items:center;justify-content:center;padding-left:6px;
  }
  .startgate:active .play{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .startgate .txt{font-size:clamp(16px,4vw,20px);font-weight:500;color:var(--soft);}

  .turntalk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:0;padding:26px 20px 24px;text-align:center;animation:ttIn .5s ease forwards;}
  @keyframes ttIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .tt-head{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}
  .tt-icon{width:clamp(64px,16vw,108px);display:inline-flex;}
  .tt-icon svg{width:100%;height:auto;display:block;}
  .tt-title{font-size:clamp(30px,7.5vw,52px);font-weight:500;color:var(--teal-d);line-height:1;}
  .tt-q{font-size:clamp(20px,5.4vw,34px);font-weight:500;color:var(--ink);max-width:680px;line-height:1.35;margin-top:clamp(40px,11vh,100px);}
  .tt-timerrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:auto;
    cursor:pointer;padding:8px 24px 8px 10px;border-radius:999px;border:2.5px solid var(--teal);background:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;}
  .tt-timerrow:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .tt-ring{position:relative;flex:0 0 auto;width:clamp(58px,13vw,84px);height:clamp(58px,13vw,84px);display:inline-flex;}
  .tt-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .tt-track{fill:none;stroke:#ece3cf;stroke-width:9;}
  .tt-prog{fill:none;stroke:var(--teal);stroke-width:9;stroke-linecap:round;stroke-dasharray:263.9;stroke-dashoffset:0;transition:stroke .3s;}
  .tt-prog.done{stroke:var(--coral);}
  .tt-prog.warn{stroke:var(--coral);}
  .tt-count.warn{color:var(--coral);}
  .tt-count{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:clamp(22px,5.5vw,36px);font-weight:500;color:var(--teal-d);}
  .tt-time{font-size:clamp(18px,4.4vw,26px);font-weight:500;color:var(--coral);}
  .tt-time.done{color:var(--teal-d);animation:ttDone .45s ease;}
  @keyframes ttDone{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">I can count and say how many.</div>
    <div class="controls">
      <button class="iconbtn" id="replayBtn" title="Replay">↺</button>
      <button class="iconbtn" id="soundBtn" title="Sound on/off">🔊</button>
      <button class="iconbtn" id="playBtn" title="Play / Pause">⏸</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="readout" id="readout">
    <div class="answerbox" id="answerbox"><span class="abq">How many?</span><span class="abn" id="abn">4</span></div>
  </div>
  <div class="hint">Plays once with sound • tap 🔊 to mute • tap ⏸ to pause • tap ↺ to replay</div>
</div>

<div class="startgate" id="startgate">
  <h2>I can count and say how many.</h2>
  <div class="play">▶</div>
  <div class="txt">Tap to start</div>
</div>

<script>
(function(){
  "use strict";
  var OBJS=[
    {e:'🍎',many:'apples',one:'apple'},
    {e:'⭐',many:'stars',one:'star'},
    {e:'🌸',many:'flowers',one:'flower'},
    {e:'🐞',many:'ladybugs',one:'ladybug'},
    {e:'🎈',many:'balloons',one:'balloon'},
    {e:'🐟',many:'fish',one:'fish'},
    {e:'🦋',many:'butterflies',one:'butterfly'},
    {e:'🐸',many:'frogs',one:'frog'}
  ];
  // playlist: {object index, count, config} — mixes sizes & arrangements
  var PLAY=[
    {o:0,n:4,c:'linear'}
  ];
  var COLS={1:1,2:2,3:3,4:2,5:3,6:3,7:4,8:4,9:3,10:5};

  var stage=document.getElementById('stage'),
      answerbox=document.getElementById('answerbox'),
      abn=document.getElementById('abn'),
      soundBtn=document.getElementById('soundBtn'),
      playBtn=document.getElementById('playBtn'),
      replayBtn=document.getElementById('replayBtn'),
      startgate=document.getElementById('startgate'),
      readout=document.getElementById('readout');

  var roundId=0, events=[], clock=0, lastTs=0, paused=false, playIdx=-1;
  var obj=null, N=0, cfg='', positions=[], soundOn=true, audioCtx=null, objectiveHeard=false, preferredVoice=null, _utter=null;
  var CIRC=2*Math.PI*42;
  var TIMER_SECS=30, countdownActive=false, countdownStart=0, lastSecShown=-1, timeEl=null, countEl=null, progEl=null, applesRevealed=false;

  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---- layout (no overlap) ----
  function layout(n,c){
    var pts=[],i,t,x,y;
    if(c==='linear'){ for(i=0;i<n;i++){t=(i+0.5)/n;pts.push({x:10+t*80,y:50});} }
    else if(c==='array'){
      var cols=COLS[n]||Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),placed=0,r,cc;
      for(r=0;r<rows;r++){var rc=Math.min(cols,n-placed),off=(cols-rc)/2;
        for(cc=0;cc<rc;cc++){pts.push({x:12+((off+cc+0.5)/cols)*76,y:18+((r+0.5)/rows)*64});}
        placed+=rc;}
    } else if(c==='circular'){
      if(n===1)pts.push({x:50,y:50});
      else for(i=0;i<n;i++){var a=(-90+i*360/n)*Math.PI/180;pts.push({x:50+34*Math.cos(a),y:50+32*Math.sin(a)});}
    } else {
      var cols2=Math.max(1,Math.round(Math.sqrt(n*1.55))),rows2=Math.ceil(n/cols2);
      while(cols2*rows2<n)cols2++;
      var cw=76/cols2,ch=70/rows2,cells=[];for(i=0;i<cols2*rows2;i++)cells.push(i);shuffle(cells);
      for(i=0;i<n;i++){var cell=cells[i],c2=cell%cols2,r2=Math.floor(cell/cols2);
        var jx=(Math.random()-0.5)*cw*0.5,jy=(Math.random()-0.5)*ch*0.5;
        pts.push({x:12+cw*(c2+0.5)+jx,y:15+ch*(r2+0.5)+jy});}
    }
    return pts;
  }
  function fontPx(){
    var W=stage.clientWidth,H=stage.clientHeight,f=Math.min(120,Math.min(W,H)*0.34),i,j,m=Infinity;
    if(positions.length>=2){for(i=0;i<positions.length;i++)for(j=i+1;j<positions.length;j++){
      var dx=(positions[i].x-positions[j].x)*W/100,dy=(positions[i].y-positions[j].y)*H/100,d=Math.hypot(dx,dy);if(d<m)m=d;}
      f=Math.min(f,m*0.64);}
    var edge=Infinity;positions.forEach(function(p){var cx=p.x*W/100,cy=p.y*H/100;edge=Math.min(edge,cx,W-cx,cy,H-cy);});
    if(isFinite(edge))f=Math.min(f,edge*1.7);
    return Math.max(26,f);
  }

  // ---- sound ----
  function unlockAudio(){ if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} }
  function blip(order){
    if(!soundOn||!audioCtx)return;
    try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=420+order*45;var t=audioCtx.currentTime;
      g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);o.start(t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);o.stop(t+0.24);}catch(e){}
  }
  function chime(){
    if(!soundOn||!audioCtx)return;
    [523,659,784,1047].forEach(function(fr,k){try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=fr;var t=audioCtx.currentTime+k*0.10;
      g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);o.start(t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);o.stop(t+0.32);}catch(e){}});
  }
  function timeUpChime(){
    if(!soundOn||!audioCtx)return;
    [{f:1047,t:0},{f:784,t:0.30}].forEach(function(s){try{
      var o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o2.type='sine';o.frequency.value=s.f;o2.frequency.value=s.f*2;
      var t=audioCtx.currentTime+s.t;
      g.gain.value=0.0001;o.connect(g);o2.connect(g);g.connect(audioCtx.destination);
      o.start(t);o2.start(t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.85);
      o.stop(t+0.9);o2.stop(t+0.9);
    }catch(e){}});
  }
  function timerEndSound(){
    if(!soundOn||!audioCtx)return;
    [784,988].forEach(function(fr,k){try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=fr;var t=audioCtx.currentTime+k*0.18;
      g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);o.start(t);
      g.gain.exponentialRampToValueAtTime(0.15,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.stop(t+0.52);}catch(e){}});
  }
  function pickVoice(){
    if(!('speechSynthesis' in window))return;
    var vs=speechSynthesis.getVoices(); if(!vs||!vs.length)return;
    var en=vs.filter(function(v){return /^en(-|_|$)/i.test(v.lang);});
    if(!en.length){ preferredVoice=null; return; }
    function find(names,localOnly){
      for(var p=0;p<names.length;p++){for(var i=0;i<en.length;i++){
        var v=en[i]; if(localOnly && !v.localService) continue;
        if(v.name.toLowerCase().indexOf(names[p])>-1) return v;
      }} return null;
    }
    // 1) natural on-device voices (sound good AND always audible)
    var v=find(['samantha','ava','allison','serena','zoe','evan','nathan','alex','daniel','karen','moira','tessa','fiona'], true);
    // 2) natural voices that may stream online (best when connected to the internet)
    if(!v) v=find(['natural','google us english','aria','jenny','guy','google'], false);
    // 3) any on-device English voice
    if(!v) v=find([''], true);
    preferredVoice = v || null;   // otherwise use the browser's default voice
  }
  if('speechSynthesis' in window){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){} }
  function applyVoice(u){ if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang||'en-US';} else {u.lang='en-US';} }

  function say(text){
    if(!soundOn)return;
    if('speechSynthesis' in window){try{var u=new SpeechSynthesisUtterance(text);
      u.rate=0.9;u.pitch=1.0;applyVoice(u);
      _utter=u;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
  }
  function speakObjective(){
    if(!soundOn||objectiveHeard)return;
    if('speechSynthesis' in window){try{
      var u=new SpeechSynthesisUtterance("I can count and say how many.");
      u.rate=0.75;u.pitch=1.0;applyVoice(u);u.onstart=function(){objectiveHeard=true;};
      u.onend=function(){ revealApples(); };
      _utter=u;speechSynthesis.cancel();speechSynthesis.speak(u);
    }catch(e){}}
  }

  // ---- visuals ----
  function spawn(i){
    var el=stage.children[i]; if(!el)return;
    el.classList.add('counted'); el.querySelector('.badge').textContent=i+1;
  }
  function sparkle(){
    var emo=['⭐','✨','🌟','🎉'],k;
    for(k=0;k<14;k++){(function(){
      var s=document.createElement('div');s.className='spark';s.textContent=pick(emo);
      s.style.left=(15+Math.random()*70)+'%';s.style.top=(20+Math.random()*55)+'%';
      s.style.fontSize=(18+Math.random()*16)+'px';s.style.animationDelay=(Math.random()*0.3)+'s';
      stage.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1700);
    })();}
  }

  var TT_HTML=`<div class="turntalk">
    <div class="tt-head">
      <span class="tt-icon"><svg viewBox="0 0 130 92" xmlns="http://www.w3.org/2000/svg">
        <circle cx="34" cy="60" r="13" fill="#17b8c4"/>
        <path d="M14,92 q0,-22 20,-22 q20,0 20,22 z" fill="#17b8c4"/>
        <circle cx="96" cy="60" r="13" fill="#ef6f5b"/>
        <path d="M76,92 q0,-22 20,-22 q20,0 20,22 z" fill="#ef6f5b"/>
        <rect x="22" y="6" width="38" height="26" rx="11" fill="#fff" stroke="#17b8c4" stroke-width="3"/>
        <path d="M30,30 l-3,12 l15,-9 z" fill="#17b8c4"/>
        <circle cx="33" cy="19" r="2.6" fill="#17b8c4"/><circle cx="41" cy="19" r="2.6" fill="#17b8c4"/><circle cx="49" cy="19" r="2.6" fill="#17b8c4"/>
        <rect x="72" y="12" width="36" height="24" rx="11" fill="#fff" stroke="#ef6f5b" stroke-width="3"/>
        <path d="M100,34 l3,12 l-15,-9 z" fill="#ef6f5b"/>
        <circle cx="82" cy="24" r="2.4" fill="#ef6f5b"/><circle cx="90" cy="24" r="2.4" fill="#ef6f5b"/><circle cx="98" cy="24" r="2.4" fill="#ef6f5b"/>
      </svg></span>
      <span class="tt-title">Turn and Talk</span>
    </div>
    <div class="tt-q">Can you think of a time when you needed to know how many?</div>
    <div class="tt-timerrow">
      <span class="tt-ring"><svg viewBox="0 0 100 100"><circle class="tt-track" cx="50" cy="50" r="42"/><circle class="tt-prog" cx="50" cy="50" r="42"/></svg><span class="tt-count">30</span></span>
      <span class="tt-time">Tap to start</span>
    </div>
  </div>`;
  function startCountdown(){
    if(countdownActive) return;
    countdownActive=true; countdownStart=clock; lastSecShown=TIMER_SECS;
    if(countEl){ countEl.textContent=TIMER_SECS; countEl.classList.remove('warn'); }
    if(timeEl){ timeEl.classList.remove('done'); timeEl.textContent="seconds"; }
    if(progEl){ progEl.classList.remove('done'); progEl.classList.remove('warn'); progEl.style.strokeDashoffset='0'; }
  }
  function showTurnTalk(){
    answerbox.classList.remove('show');
    if(readout) readout.style.display='none';
    stage.innerHTML=TT_HTML;
    timeEl=stage.querySelector('.tt-time');
    countEl=stage.querySelector('.tt-count');
    progEl=stage.querySelector('.tt-prog');
    countdownActive=false; lastSecShown=-1;
    if(countEl){ countEl.textContent=TIMER_SECS; countEl.classList.remove('warn'); }
    if(timeEl){ timeEl.textContent='Tap to start'; timeEl.classList.remove('done'); }
    if(progEl){ progEl.classList.remove('done'); progEl.classList.remove('warn'); progEl.style.strokeDasharray=CIRC.toFixed(1); progEl.style.strokeDashoffset='0'; }
    var row=stage.querySelector('.tt-timerrow');
    if(row) row.addEventListener('click', startCountdown);
  }

  function revealApples(){
    if(applesRevealed) return;
    applesRevealed=true;
    Array.prototype.forEach.call(stage.querySelectorAll('.obj'), function(el){ el.classList.add('in'); });
  }

  function startRound(){
    roundId++;
    countdownActive=false; timeEl=null; lastSecShown=-1;
    playIdx=playIdx+1;
    var spec=PLAY[playIdx];
    var isLast=(playIdx>=PLAY.length-1);
    obj=OBJS[spec.o]; N=spec.n; cfg=spec.c;
    positions=layout(N,cfg);
    // render objects hidden -- they appear after the spoken objective
    stage.innerHTML='';
    if(readout) readout.style.display='';
    applesRevealed=false;
    var fpx=fontPx();
    positions.forEach(function(p,idx){
      var d=document.createElement('div');
      d.className='obj';d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.fontSize=fpx+'px';
      d.style.animationDelay=(idx*0.06)+'s';
      d.innerHTML='<span class="glyph">'+obj.e+'</span><span class="badge"></span>';
      stage.appendChild(d);
    });
    answerbox.classList.remove('show'); abn.textContent=N;
    // build timeline
    events=[]; var fired=new Set();
    events.push({t:3500, fn:revealApples});   // fallback in case the voice's end event doesn't fire
    var start=4600, step=1300, i;
    for(i=1;i<=N;i++){ (function(k){ events.push({t:start+(k-1)*step, fn:function(){
      spawn(k-1); blip(k); say(String(k));
    }});})(i); }
    var last=start+(N-1)*step;
    events.push({t:last+1700, fn:function(){
      answerbox.classList.add('show'); chime();
      say("There are "+N+" "+(N===1?obj.one:obj.many));
    }});
    if(isLast){
      events.push({t:last+5000, fn:function(){
        showTurnTalk();
        say("Turn and Talk. Can you think of a time when you needed to know how many?");
      }});
    } else {
      events.push({t:last+5200, fn:function(){ startRound(); }});
    }
    events._fired=fired;
    clock=0;
  }

  function tick(ts){
    if(!lastTs)lastTs=ts;
    var dt=ts-lastTs; lastTs=ts;
    if(!paused){
      clock+=dt;
      var rid=roundId, i, ev=events, fired=ev._fired;
      for(i=0;i<ev.length;i++){
        if(!fired.has(i) && ev[i].t<=clock){
          fired.add(i); ev[i].fn();
          if(roundId!==rid) return requestAnimationFrame(tick); // new round began
        }
      }
      if(countdownActive){
        var elapsed=clock-countdownStart;
        var frac=1-elapsed/(TIMER_SECS*1000); if(frac<0)frac=0;
        if(progEl) progEl.style.strokeDashoffset=(CIRC*(1-frac)).toFixed(1);
        var rem=TIMER_SECS-Math.floor(elapsed/1000); if(rem<0)rem=0;
        if(rem!==lastSecShown){
          lastSecShown=rem;
          if(countEl) countEl.textContent=rem;
          var warn = rem<=10;
          if(progEl) progEl.classList.toggle('warn', warn && rem>0);
          if(countEl) countEl.classList.toggle('warn', warn);
          if(rem===0){
            countdownActive=false;
            if(progEl){ progEl.style.strokeDashoffset=CIRC.toFixed(1); progEl.classList.add('done'); }
            if(timeEl){ timeEl.textContent="Time's up!"; timeEl.classList.add('done'); }
            timeUpChime();
          }
        }
      }
    }
    requestAnimationFrame(tick);
  }

  // resize: keep objects sized to the (flexing) stage
  var rt;
  window.addEventListener('resize',function(){
    clearTimeout(rt); rt=setTimeout(function(){
      var fpx=fontPx();
      Array.prototype.forEach.call(stage.querySelectorAll('.obj'),function(el){el.style.fontSize=fpx+'px';});
    },120);
  });

  soundBtn.addEventListener('click',function(){
    soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇';
    if(soundOn){ unlockAudio(); } else { try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){} }
  });
  playBtn.addEventListener('click',function(){
    paused=!paused; playBtn.textContent=paused?'▶':'⏸';
    if(paused){ try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){} }
  });
  function playFromStart(){
    if(startgate) startgate.style.display='none';
    if(soundOn){ unlockAudio(); if(audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}} }
    try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
    paused=false; playBtn.textContent='⏸';
    objectiveHeard=false; playIdx=-1; lastTs=0;
    speakObjective();
    startRound();
  }
  replayBtn.addEventListener('click', playFromStart);
  startgate.addEventListener('click', playFromStart);

  requestAnimationFrame(tick);
})();
</script>
</body>
